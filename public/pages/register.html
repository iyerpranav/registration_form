<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <link rel="stylesheet" href="/styles/styles2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="form_body">
        <div class="page_header" style="display: flex; justify-content: center;">
            <p>Registration Form</p>
        </div>
        <form action="/newuser" method="POST">
            <div class="fullname">
                <label for="name">Full Name</label> <br>
                <input type="text" name="name" id="name" placeholder="Enter Full Name" required pattern="^[A-Za-z]+ [A-Za-z]+$">
            </div>

            <div class="emailaddress">
                <label for="email">Email Address</label> <br>
                <input type="email" name="email" id="email" placeholder="Enter Email Address" required>
            </div>

            <div class="password">
                <label for="passwd">Set Password</label> <br>
                <input type="password" name="passwd" id="passwd" placeholder="Enter Password" required minlength="8">
            </div>

            <div class="mob_and_dob">
                <div class="mobile">
                    <label for="mobile">Mobile Number</label> <br>
                    <input type="tel" name="mobile" id="mobile" placeholder="Enter Mobile Number" required pattern="[0-9]{10}">
                    <input type="hidden" id="mobCode" name="mobCode">
                </div>
                <div class="dob">
                    <label for="dob">Birth Date</label> <br>
                    <input type="date" name="dob" id="dob" required max="2007-12-31">
                </div>
            </div>

            <div class="gender">
                <div class="gender_title">
                    <label for="gender">Gender</label><br>
                </div>
                <div class="gender_radio">
                    <input type="radio" id="male" name="gender" value="M" required>
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="F">
                    <label for="female">Female</label>
                    <input type="radio" id="na" name="gender" value="O">
                    <label for="na">Other</label>
                </div>
            </div>

            <div class="address">
                <label for="address">Address</label><br>
                <input type="text" name="address" id="address" placeholder="Enter Address" required>

                <div class="country_and_postal">
                    <div class="country">
                        <input id="countryName" type="text" list="countries" placeholder="Enter Country" required>
                        <input type="hidden" id="countryCode" name="country">
                        <datalist id="countries">
                        </datalist>
                    </div>
                    <div class="postal">
                        <input type="text" name="postal" id="postal" placeholder="Enter Postal Code" required pattern="[0-9]{4,10}">
                    </div>
                </div>
            </div>

            <div class="submit_btn" style="display: flex;">
                <input type="submit">
            </div>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/scripts/script.js"></script>
</body>

</html>
