<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <link rel="stylesheet" href="/styles/styles2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="form_body">
        <div class="page_header" style="display: flex; justify-content: center;">
            <p>Registration Form</p>
        </div>
        <form action="/newuser" method="POST">
            <div class="fullname">
                <label for="fname">Full Name</label> <br>
                <input type="text" name="fname" id="fname" placeholder="Enter Full Name">
            </div>

            <div class="emailaddress">
                <label for="email">Email Address</label> <br>
                <input type="email" name="email" id="email" placeholder="Enter Email Address">
            </div>

            <div class="password">
                <label for="passwd">Set Password</label> <br>
                <input type="password" name="passwd" id="passwd" placeholder="Enter Password">
            </div>

            <div class="mob_and_dob">
                <div class="mobile">
                    <label for="mobile">Mobile Number</label> <br>
                    <input type="tel" name="mobile" id="mobile" placeholder="Enter Mobile Number">
                </div>
                <div class="dob">
                    <label for="dob">Birth Date</label> <br>
                    <input type="date" name="dob" id="dob">
                </div>
            </div>

            <div class="gender">
                <div class="gender_title">
                    <label for="gender">Gender</label><br>
                </div>
                <div class="gender_radio">
                    <input type="radio" id="male" name="gender" value="Male">
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>
                    <input type="radio" id="na" name="gender" value="Prefer not to say">
                    <label for="na">Prefer not to say</label>
                </div>
            </div>

            <div class="address">
                <label for="address">Address</label><br>
                <input type="text" name="address" id="address" placeholder="Enter Address">

                <div class="country_and_postal">
                    <div class="country">
                        <select name="country" id="country">
                            <option value="">Country</option>
                            <option value="US">United States</option>
                            <option value="IN">India</option>
                            <option value="GB">United Kingdom</option>
                            <option value="CA">Canada</option>
                            <option value="AU">Australia</option>
                        </select>
                    </div>
                    <div class="postal">
                        <input type="text" name="postal" id="postal" placeholder="Enter Postal Code">
                    </div>
                </div>
            </div>

            <div class="submit_btn" style="display: flex;">
                <input type="submit">
            </div>
        </form>
    </div>
</body>

</html>
