<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="styles1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="page_header">
        <p>Enter your details to log in.</p>
    </div>
    <div class="form_body">
        <form>
            <div class="fullname">
                <label for="fname">Your Name</label> <br>
                <input type="text" name="fname" id="fname" placeholder="Enter Full Name">
            </div>
            
            <div class="password">
                <label for="passwd">Your Password</label> <br>
                <input type="password" name="passwd" id="passwd" placeholder="Enter Password">
            </div>

            <div class="submit_btn" style="display: flex;">
                <button>Log In</button>
            </div>

            <div style="flex: 1; display: flex; justify-content: space-around;">
                <div>
                    <a href="register.html">
                        <label style="font-size: 1.2vh; flex: 1;">Don't have an account?</label>
                    </a>
                </div>
                <div>
                    <label style="font-size: 1.2vh; flex: 1;">Forgot Password?</label>
                </div>
            </div>


        </form>
    </div>
</body>

</html>
